# Gesture handling is currently enabled only by the macOS input adapter.
- name: zen.pip.trackpad.enabled
  value: true

# CSS pixels per second; slow accumulated travel does not count as a fling.
- name: zen.pip.trackpad.fling-speed
  value: 650

- name: zen.pip.trackpad.fling-distance
  value: 12

- name: zen.pip.trackpad.snap-duration-ms
  value: 180

# CSS pixel inset for release animations and explicit corner placement.
- name: zen.pip.trackpad.edge-padding
  value: 16
